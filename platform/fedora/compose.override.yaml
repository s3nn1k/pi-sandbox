services:
  pi-agent:
    pids_limit: 4096
    volumes:
      - ${AGENT_HOME}/tmp/pi-cache/herdr-bridge:${AGENT_HOME}/.config/herdr

  dind:
    pids_limit: 8192
    mem_limit: 4g
    networks:
      - pinet
    ports:
      - "127.0.0.1:8600-8699:8600-8699"

networks:
  pinet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: pi-sbx0
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  gomodcache:
    name: pi-agent_gomodcache
    external: true
