services:
  pi-agent:
    volumes:
      - herdr-sock:${AGENT_HOME}/.config/herdr

  dind:
    ports:
      - "8600-8799:8600-8799"

  herdr-bridge:
    image: alpine/socat@sha256:c5a091e1e735a90aa941a5828529dbe6c6157407a8047a9aa473faa133361b82
    restart: unless-stopped
    command:
      - UNIX-LISTEN:/herdr-sock/herdr.sock,fork,mode=777,unlink-early,unlink-close
      - TCP:192.168.5.2:4761
    healthcheck:
      test: ["CMD-SHELL", "netstat -lx | grep -q '/herdr-sock/herdr.sock'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    volumes:
      - herdr-sock:/herdr-sock

volumes:
  herdr-sock:
